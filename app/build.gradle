plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.watchlisten.music'
    compileSdk 35
    defaultConfig {
        applicationId 'com.watchlisten.music'
        minSdk 30
        targetSdk 35
        versionCode 16
        versionName '0.10.0'
    }
    buildFeatures { compose true; buildConfig true }
    testOptions { unitTests.returnDefaultValues = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    packaging { resources.excludes += ['/META-INF/AL2.0', '/META-INF/LGPL2.1'] }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Debug uses a local development key. Release stays unsigned until the release owner signs it.
apply from: rootProject.file('gradle/debug-signing.gradle')

def vectorSources = rootProject.fileTree('assets/icons') { include '*.svg' }
def vectorOutputs = vectorSources.files.collect { source ->
    file("src/main/res/drawable/ic_${source.name.substring(0, source.name.length() - 4)}.xml")
} + [file('src/main/res/drawable/ic_brand.xml')]

def generateVectors = tasks.register('generateVectors', Exec) {
    workingDir rootProject.rootDir
    commandLine providers.gradleProperty('pythonExe').getOrElse('python'), rootProject.file('tools/build_vectors.py')
    inputs.files(vectorSources)
    inputs.file rootProject.file('assets/brand/watch-listen.svg')
    inputs.file rootProject.file('tools/build_vectors.py')
    // Track generated files individually so other hand-authored drawables are never stale outputs.
    outputs.files(vectorOutputs)
    if (rootProject.file('design').isDirectory()) outputs.file rootProject.file('design/icons.js')
}
tasks.named('preBuild').configure { dependsOn generateVectors }

dependencies {
    implementation project(':lyrics-core')
    implementation platform('androidx.compose:compose-bom:2025.04.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'androidx.media3:media3-datasource-okhttp:1.8.0'
    implementation 'com.squareup.okhttp3:okhttp:5.3.0'
    implementation 'com.google.zxing:core:3.5.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
